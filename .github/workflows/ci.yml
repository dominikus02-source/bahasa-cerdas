name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Placeholder values — CI only type-checks/builds, it never connects to real
    # services. Real secrets live in Vercel, not in CI.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      NEXT_PUBLIC_SITE_URL: "https://example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Baseline diagnostic V2 gate
        run: npm run test:diagnostic-baseline-v2

      - name: TTS eligibility gate
        continue-on-error: true
        run: npm run test:tts-eligibility

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build realtime game server
        working-directory: game-server
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Verify VPS web container build
        run: |
          cat >/tmp/bc-web-ci.env <<'EOF'
          DATABASE_URL=postgresql://user:pass@localhost:5432/db
          DIRECT_URL=postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
          NEXT_PUBLIC_SITE_URL=https://example.com
          EOF
          DOCKER_BUILDKIT=1 docker build \
            -f Dockerfile.web \
            --secret id=web_env,src=/tmp/bc-web-ci.env \
            -t bahasacerdas-web-ci .
          rm -f /tmp/bc-web-ci.env
