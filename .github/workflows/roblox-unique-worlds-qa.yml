name: Roblox Unique Worlds Static QA

on:
  push:
    branches:
      - feat/roblox-unique-worlds-20261123
    paths:
      - 'roblox/**/src/ServerScriptService/WorldKit.lua'
      - 'roblox/**/src/ServerScriptService/UniqueWorlds.lua'
      - 'roblox/game-factory/**'
      - '.github/workflows/roblox-unique-worlds-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-world-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 13 worlds are correctly wired
        run: python3 roblox/game-factory/qa_unique_worlds.py
