name: Roblox Lobby Natural World - static QA

on:
  push:
    branches:
      - feat/roblox-kota-aksara-natural-world-20261123
    paths:
      - "roblox/bc-lobby/**"
      - ".github/workflows/roblox-lobby-natural-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Check world source, palette, and Rojo paths
        run: python3 roblox/bc-lobby/qa/check_natural_world.py
