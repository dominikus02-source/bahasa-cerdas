name: Roblox Luau Syntax QA

on:
  push:
    branches:
      - feat/roblox-13-distinct-game-hub-20261123
    paths:
      - 'roblox/**/*.lua'
      - '.github/workflows/roblox-luau-syntax-qa.yml'
  pull_request:
    paths:
      - 'roblox/**/*.lua'
      - '.github/workflows/roblox-luau-syntax-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-luau:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install official Luau 0.748 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip -o /tmp/luau-ubuntu.zip
          mkdir -p /tmp/bc-luau
          unzip -q /tmp/luau-ubuntu.zip -d /tmp/bc-luau
          chmod +x /tmp/bc-luau/luau-compile
      - name: Parse every Roblox Lua source
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            /tmp/bc-luau/luau-compile --only-parse "$file" >/dev/null
            count=$((count + 1))
          done < <(find roblox -type f -name '*.lua' -print0)
          test "$count" -ge 100
          echo "PASS: parsed $count Roblox Lua files"
