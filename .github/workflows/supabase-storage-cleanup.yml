name: Supabase Storage Cleanup

on:
  push:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean unreferenced Supabase Storage
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ssh-keyscan -H 103.242.10.81 >> "$HOME/.ssh/known_hosts"
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes bcadmin@103.242.10.81 'docker exec -i bahasacerdas-prod-web-1 node' <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const { createClient } = require("@supabase/supabase-js");
          const fs = require("fs");

          const prisma = new PrismaClient();
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) throw new Error("Supabase URL/service-role key is missing from production web container.");

          const supabase = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });

          function normalize(value, bucket) {
            if (!value) return null;
            let s = String(value).split("?")[0];
            const marker = `/storage/v1/object/public/${bucket}/`;
            const i = s.indexOf(marker);
            if (i >= 0) return s.slice(i + marker.length).replace(/^\/+/, "");
            const prefix = `${bucket}/`;
            if (s.startsWith(prefix)) return s.slice(prefix.length);
            if (/^https?:\/\//.test(s)) return null;
            return s.replace(/^\/+/, "");
          }

          async function referencedBySQL(sql) {
            const rows = await prisma.$queryRawUnsafe(sql);
            return new Set(rows.map(r => r.path).filter(Boolean));
          }

          async function listAll(bucket, prefix = "", out = []) {
            let offset = 0;
            while (true) {
              const { data, error } = await supabase.storage.from(bucket).list(prefix, {
                limit: 1000,
                offset,
                sortBy: { column: "name", order: "asc" },
              });
              if (error) throw new Error(`list ${bucket}/${prefix}: ${error.message}`);
              if (!data || data.length === 0) break;
              for (const item of data) {
                const full = prefix ? `${prefix}/${item.name}` : item.name;
                if (item.id) out.push(full);
                else await listAll(bucket, full, out);
              }
              if (data.length < 1000) break;
              offset += data.length;
            }
            return out;
          }

          async function sizesFor(bucket, paths) {
            if (!paths.length) return 0;
            let total = 0;
            for (let i = 0; i < paths.length; i += 500) {
              const batch = paths.slice(i, i + 500);
              const rows = await prisma.$queryRawUnsafe(
                `select coalesce(sum((metadata->>'size')::bigint),0) bytes from storage.objects where bucket_id=$1 and name = any($2::text[])`,
                bucket, batch
              );
              total += Number(rows[0]?.bytes || 0);
            }
            return total;
          }

          async function removeBatched(bucket, paths) {
            for (let i = 0; i < paths.length; i += 1000) {
              const batch = paths.slice(i, i + 1000);
              const { error } = await supabase.storage.from(bucket).remove(batch);
              if (error) throw new Error(`remove ${bucket} batch ${Math.floor(i/1000)+1}: ${error.message}`);
              console.log(`removed ${bucket}: ${Math.min(i + batch.length, paths.length)}/${paths.length}`);
            }
          }

          (async () => {
            // Only delete files that are known to be unreferenced, plus old recording
            // prefixes that have zero database references.
            const avatarRefsRaw = await prisma.$queryRawUnsafe(`
              select "avatar" path from public."User" where "avatar" is not null
              union all select "avatarUrl" from public."GameSession" where "avatarUrl" is not null
              union all select "avatarUrl" from public."Community" where "avatarUrl" is not null
              union all select "bannerUrl" from public."Community" where "bannerUrl" is not null
              union all select "avatarUrl" from public."MainPlayer" where "avatarUrl" is not null
              union all select "avatar_url" from public.profiles where "avatar_url" is not null
            `);
            const avatarRefs = new Set(avatarRefsRaw.map(r => normalize(r.path, "avatars")).filter(Boolean));

            const documentRefsRaw = await prisma.$queryRawUnsafe(`
              select "fileUrl" path from public."Materi" where "fileUrl" is not null
              union all select "fileKey" from public."Materi" where "fileKey" is not null
              union all select "praktikUrl" from public."PenugasanSubmission" where "praktikUrl" is not null
              union all select "fileUrl" from public."Karya" where "fileUrl" is not null
              union all select "fileKey" from public."Karya" where "fileKey" is not null
              union all select "fileUrl" from public."RPP" where "fileUrl" is not null
              union all select "fileKey" from public."RPP" where "fileKey" is not null
              union all select "fileUrl" from public."PurchaseHistory" where "fileUrl" is not null
              union all select "fileKey" from public."PurchaseHistory" where "fileKey" is not null
              union all select "fileUrl" from public."BankSoal" where "fileUrl" is not null
              union all select "fileKey" from public."BankSoal" where "fileKey" is not null
              union all select "pdfUrl" from public."Certificate" where "pdfUrl" is not null
              union all select "pdfUrl" from public."KompetensiCertificate" where "pdfUrl" is not null
              union all select "fileUrl" from public."CommunityPost" where "fileUrl" is not null
              union all select "karyaUrl" from public."PengumumanSubmission" where "karyaUrl" is not null
            `);
            const documentRefs = new Set(documentRefsRaw.map(r => normalize(r.path, "documents")).filter(Boolean));

            const imageRefsRaw = await prisma.$queryRawUnsafe(`
              select "imageUrl" path from public."GameQuestion" where "imageUrl" is not null
              union all select "imageUrl" from public."UKBIQuestion" where "imageUrl" is not null
              union all select "coverImageUrl" from public."Artikel" where "coverImageUrl" is not null
              union all select "cover_image_url" from public.literary_works where "cover_image_url" is not null
              union all select "thumbnailUrl" from public."Video" where "thumbnailUrl" is not null
              union all select "thumbnailUrl" from public."PaketKompetensi" where "thumbnailUrl" is not null
              union all select "posterUrl" from public."Lomba" where "posterUrl" is not null
              union all select "thumbnailUrl" from public."CoursePlaylist" where "thumbnailUrl" is not null
              union all select "thumbnailUrl" from public."Quiz" where "thumbnailUrl" is not null
              union all select "avatarUrl" from public."Community" where "avatarUrl" is not null
              union all select "bannerUrl" from public."Community" where "bannerUrl" is not null
              union all select "avatar_url" from public.profiles where "avatar_url" is not null
            `);
            const imageRefs = new Set(imageRefsRaw.map(r => normalize(r.path, "images")).filter(Boolean));

            const audioRefsRaw = await prisma.$queryRawUnsafe(`
              select "audioUrl" path from public."GameQuestion" where "audioUrl" is not null
              union all select "audioUrl" from public."UKBIQuestion" where "audioUrl" is not null
            `);
            const audioRefs = new Set(audioRefsRaw.map(r => normalize(r.path, "audio")).filter(Boolean));

            const [avatars, documents, images, audio] = await Promise.all([
              listAll("avatars"),
              listAll("documents"),
              listAll("images"),
              listAll("audio"),
            ]);

            const candidates = {
              avatars: avatars.filter(p => !avatarRefs.has(p)),
              documents: documents.filter(p => !documentRefs.has(p)),
              images: images.filter(p => !imageRefs.has(p)),
              audio: audio.filter(p => (p.startsWith("rekaman/") || p.startsWith("ukbi/")) && !audioRefs.has(p)),
            };

            const bytes = {};
            for (const [bucket, paths] of Object.entries(candidates)) {
              bytes[bucket] = await sizesFor(bucket, paths);
            }
            const total = Object.values(bytes).reduce((a, b) => a + b, 0);
            const summary = {
              beforeBytes: Number((await prisma.$queryRawUnsafe(`select coalesce(sum((metadata->>'size')::bigint),0) bytes from storage.objects`))[0].bytes),
              candidates: Object.fromEntries(Object.entries(candidates).map(([k,v]) => [k,{objects:v.length,bytes:bytes[k]}])),
              totalCandidateBytes: total,
            };
            console.log("CLEANUP_PLAN="+JSON.stringify(summary));

            // Guard: only proceed when the computed set is substantial enough to be
            // the audited unreferenced payload. This prevents accidental broad deletes.
            if (total < 1900000000) throw new Error(`Safety guard blocked cleanup: candidate bytes only ${total}`);

            const ts = new Date().toISOString().replace(/[:.]/g, "-");
            fs.writeFileSync(`/tmp/supabase-storage-cleanup-${ts}.json`, JSON.stringify(summary, null, 2));

            for (const [bucket, paths] of Object.entries(candidates)) {
              if (paths.length) await removeBatched(bucket, paths);
            }

            const after = await prisma.$queryRawUnsafe(`select coalesce(sum((metadata->>'size')::bigint),0) bytes, count(*) objects from storage.objects`);
            console.log("CLEANUP_AFTER="+JSON.stringify(after[0]));
          })().finally(async () => {
            await prisma.$disconnect();
          }).catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
