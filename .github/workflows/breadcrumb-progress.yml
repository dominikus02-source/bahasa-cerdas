name: Recover breadcrumb build space
on:
  push:
    branches: [ops/breadcrumb-watch-20261106]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reclaim only unused build cache
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H 103.242.10.81 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 bcadmin@103.242.10.81 python3 - <<'PY'
          import pathlib,subprocess,shutil,json,os,signal,time
          free=lambda:round(shutil.disk_usage("/opt").free/2**30,2)
          result={"beforeFreeGiB":free(),"stoppedBuilds":[]}
          if result["beforeFreeGiB"]<3:
              for entry in pathlib.Path("/proc").iterdir():
                  if not entry.name.isdigit():continue
                  try:
                      if entry.stat().st_uid!=os.getuid():continue
                      args=(entry/"cmdline").read_bytes().split(b"\0")
                      if not args or not (args[0].endswith(b"docker") or args[0].endswith(b"docker-compose")):continue
                      if b"build" not in args:continue
                      cwd=str((entry/"cwd").resolve())
                      own=b"bc-book-studio:breadcrumbs-fixed-20261106" in args or b"bahasacerdas/web:breadcrumbs-20261106" in args
                      official=b"web" in args and cwd=="/opt/bahasacerdas/apps/bahasa-cerdas/ops/vps"
                      if own or official:
                          os.kill(int(entry.name),signal.SIGTERM)
                          result["stoppedBuilds"].append(int(entry.name))
                  except (OSError,PermissionError):pass
              time.sleep(3)
              first=subprocess.run(["docker","builder","prune","--force","--all","--filter","until=1h"],capture_output=True,text=True,timeout=180)
              result["cachePruneExit"]=first.returncode
              if free()<6:
                  second=subprocess.run(["docker","builder","prune","--force","--all","--keep-storage","2GB"],capture_output=True,text=True,timeout=180)
                  result["additionalCachePruneExit"]=second.returncode
          result["afterFreeGiB"]=free()
          for name in ["bahasacerdas-prod-web-1","bc-book-studio-ui-canary-web-1"]:
              data=json.loads(subprocess.check_output(["docker","inspect",name]))[0]
              result[name]={"state":data["State"]["Status"],"health":data["State"].get("Health",{}).get("Status")}
          print(json.dumps(result))
          assert result["afterFreeGiB"]>=3,"More build space is required"
          PY
