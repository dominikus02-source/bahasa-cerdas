name: Cleanup Local Supabase

on:
  workflow_dispatch:
  push:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keyscan -H 103.242.10.81 >> "$HOME/.ssh/known_hosts"
      - name: Remove local Supabase containers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes bcadmin@103.242.10.81 'set -e
            echo "=== BEFORE ==="
            docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}" | grep -Ei "^(supabase-|realtime-dev\.supabase-realtime)" || true
            names=$(docker ps -aq --filter name="^supabase-" ; docker ps -aq --filter name="^realtime-dev\.supabase-realtime$")
            names=$(printf "%s\n" "$names" | sed "/^$/d" | sort -u)
            if [ -n "$names" ]; then
              docker rm -f $names >/dev/null
            fi
            echo "=== AFTER ==="
            docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}" | grep -Ei "^(supabase-|realtime-dev\.supabase-realtime)" || true
            echo "Local Supabase containers removed. Docker volumes intentionally preserved."
          '
