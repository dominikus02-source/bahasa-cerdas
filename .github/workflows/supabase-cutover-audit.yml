name: Cleanup Local Supabase

on:
  workflow_dispatch:
  push:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keyscan -H 103.242.10.81 >> "$HOME/.ssh/known_hosts"
      - name: Stop and remove local Supabase
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes bcadmin@103.242.10.81 'set -e
            echo "=== BEFORE ==="
            docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}" | grep -Ei "supabase|postgresql|postgrest|postgrest|realtime-dev" || true
            names=$(docker ps -aq --filter name="supabase-" ; docker ps -aq --filter name="realtime-dev.supabase-realtime" )
            names=$(printf "%s\n" "$names" | sed "/^$/d" | sort -u)
            if [ -n "$names" ]; then
              echo "Stopping:"
              docker ps --format "{{.Names}}" | grep -E "^(supabase-|realtime-dev\.supabase-realtime)" || true
              docker stop $names >/dev/null
              docker rm $names >/dev/null
            fi
            echo "=== AFTER ==="
            docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}" | grep -Ei "supabase|postgresql|postgrest|realtime-dev" || true
            echo "=== NOTE ==="
            echo "Docker volumes were intentionally kept. No local Supabase container remains running."
          '
