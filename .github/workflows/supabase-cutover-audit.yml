name: Supabase Cutover Audit

on:
  push:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keyscan -H 103.242.10.81 >> "$HOME/.ssh/known_hosts"
      - name: Audit VPS
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes bcadmin@103.242.10.81 'set -e
          CONFIG=/opt/bahasacerdas/config
          for f in "$CONFIG/web.env" "$CONFIG/stack.env"; do
            echo "FILE=$f"
            for k in DATABASE_URL DIRECT_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL SUPABASE_DB_PASSWORD SUPABASE_DATABASE_URL; do
              grep -q "^$k=" "$f" 2>/dev/null && echo "$k=present" || echo "$k=absent"
            done
          done
          echo "=== SUPABASE URL HOST ==="
          grep -E "^(NEXT_PUBLIC_SUPABASE_URL|SUPABASE_URL)=" "$CONFIG/web.env" 2>/dev/null | sed -E "s#^[^=]+=https?://([^/:]+).*#SUPABASE_HOST=\\1#"
          echo "=== DB HOSTS ==="
          for f in "$CONFIG/web.env" "$CONFIG/stack.env"; do
            grep -E "^(DATABASE_URL|DIRECT_URL)=" "$f" 2>/dev/null | sed -E "s#^[^=]+=[^@]*@([^:/?]+).*#HOST=\1#"
          done
          echo "=== POSTGRES CONTAINERS ==="
          docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}" | grep -Ei "supabase|postgres" || true'
