name: Supabase Cutover Audit

on:
  push:
    branches:
      - ops/supabase-cutover-audit-20261008
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 103.242.10.81 >> "$HOME/.ssh/known_hosts"
      - name: Inspect VPS
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes bcadmin@103.242.10.81 '
            set -e
            echo "=== FILES ==="
            ls -l /opt/bahasacerdas/config/web.env /opt/bahasacerdas/config/stack.env
            echo "=== DB HOSTS ==="
            for f in /opt/bahasacerdas/config/web.env /opt/bahasacerdas/config/stack.env; do
              grep -E "^(DATABASE_URL|DIRECT_URL)=" "$f" 2>/dev/null | sed -E "s#^[^=]+=([^:]+://)?[^@]*@([^:/?]+).*#DB_HOST=\\2#"
            done
            echo "=== CONTAINERS ==="
            docker ps --format "table {{.Names}}\\t{{.Image}}\\t{{.Status}}" | grep -Ei "supabase|postgres|bahasacerdas-prod-web" || true
          '
