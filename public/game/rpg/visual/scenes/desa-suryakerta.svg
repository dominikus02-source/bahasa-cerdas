<path d="M1700 1100h170m-170 38h170m-170 38h170m-170 38h170" stroke="#bd8451" stroke-width="18" opacity=".8"/>
<path d="M1730 1070v150m55-150v150m55-150v150m55-150v150" stroke="#5d3c2b" stroke-width="10" opacity=".75"/>

