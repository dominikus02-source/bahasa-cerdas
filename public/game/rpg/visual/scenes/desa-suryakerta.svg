<svg xmlns="http://www.w3.org/2000/svg" width="2944" height="2304" viewBox="0 0 2944 2304">
<defs>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9acb72"/><stop offset="1" stop-color="#78b65d"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d7b76b"/><stop offset="1" stop-color="#b99452"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6fb8c7"/><stop offset=".5" stop-color="#8acbd3"/><stop offset="1" stop-color="#5fa9bb"/>
  </linearGradient>
  <pattern id="grassTexture" width="96" height="96" patternUnits="userSpaceOnUse">
    <path d="M12 70l5-13m9 22l4-11m42 5l5-14m-17 8l4-9" stroke="#4f934f" stroke-width="3" stroke-linecap="round" opacity=".16"/>
    <circle cx="70" cy="28" r="3" fill="#e5d77b" opacity=".18"/>
  </pattern>
  <pattern id="pathTexture" width="96" height="96" patternUnits="userSpaceOnUse">
    <path d="M14 26h24m16 40h28M22 72h17m31-48h12" stroke="#8e7350" stroke-width="4" stroke-linecap="round" opacity=".18"/>
  </pattern>
  <pattern id="fieldTexture" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M8 8v48m16-48v48m16-48v48m16-48v48" stroke="#8c713e" stroke-width="2" opacity=".22"/>
  </pattern>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="8"/>
    <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- cohesive village ground -->
<rect width="2944" height="2304" fill="url(#grass)"/>
<rect width="2944" height="2304" fill="url(#grassTexture)"/>

<!-- quiet outer village border / forest belt -->
<path d="M0 0H2944V128H0ZM0 2176H2944V2304H0ZM0 0V2304H128V0ZM2816 0V2304H2944V0Z" fill="#4e7f50" opacity=".22"/>

