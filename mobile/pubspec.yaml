name: bahasa_cerdas
description: BahasaCerdas - Ekosistem Belajar Bahasa Indonesia
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0
  connectivity_plus: ^6.0.5
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon-512.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icons/icon-512.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/icon-512.png
  android: true
  ios: false
